[package]
name = "exclawalker"
version = "0.1.0"
edition = "2021"
description = "Prepend ! to each character from stdin — for lazy fzf users"
license = "MIT"

[profile.release]
# https://github.com/BurntSushi/ripgrep/blob/master/Cargo.toml
opt-level = 3
debug = "none"
strip = "symbols"
debug-assertions = false
overflow-checks = false
lto = "fat"
panic = "abort"
incremental = false

